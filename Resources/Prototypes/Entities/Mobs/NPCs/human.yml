- type: entity
  parent: MobHuman
  suffix: Dead
  id: SalvageHumanCorpse
  name: unidentified corpse
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: RumorHealingTarget
    possibleDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    - Cold
    - Caustic
    - Asphyxiation
    - Radiation
  - type: Inventory
    templateId: corpse
  - type: MobState
    currentState: Dead
    allowedStates:
    - Alive
    - SoftCritical
    - HardCritical
    - Dead

- type: entity
  parent: MobHuman
  id: MobCluwne
  name: person
  description: A polymorphed unfortunate.
  components:
  - type: Cluwne
  - type: Speech
    speechVerb: Cluwne

