- type: entity
  parent: [SolutionTank, SolutionHuge, StructureHealthFurnitureStrong]
  id: SinkEmpty
  name: sink
  description: The faucets have been tightened to the maximum possible torque but are still known to drip.
  suffix: Empty
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
    - state: sink_stem
    - map: [ "enum.SolutionContainerLayers.Fill" ]
      state: sink-fill-1
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: sink-fill-
    solutionName: drainBuffer
  - type: SolutionManager
    solutions:
    - SolutionDrainNormal
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 1
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: Drain
    autoDrain: false
  - type: DumpableSolution
    solution: drainBuffer
  - type: Edible
    edible: Drink
    solution: tank
    destroyOnEmpty: false
    utensil: Spoon
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -3
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg

- type: entity
  parent: SinkEmpty
  id: Sink
  suffix: Water
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 480

#Wide sink

- type: entity
  parent: Sink
  id: SinkWide
  name: wide sink
  components:
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
      - state: sink_wide
      - map: [ "enum.SolutionContainerLayers.Fill" ]
        state: sink_wide-fill-1
        visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: sink_wide-fill-
    solutionName: drainBuffer
  - type: Construction
    graph: SinkWide
    node: sinkwide


- type: entity
  name: wide sink
  id: SinkWideWater
  parent: SinkWide
  suffix: Water

#Stemless Sink

- type: entity
  name: sink
  id: BaseSinkStemless
  parent: SinkEmpty
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
      - state: sink
      - map: [ "enum.SolutionContainerLayers.Fill" ]
        state: sink-fill-1
        visible: false

- type: entity
  name: sink
  id: SinkStemless
  parent: BaseSinkStemless
  components:
  - type: Construction
    graph: SinkStemless
    node: sinkstemless

- type: entity
  name: sink
  id: SinkStemlessWater
  parent: BaseSinkStemless
  suffix: Water
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 480
