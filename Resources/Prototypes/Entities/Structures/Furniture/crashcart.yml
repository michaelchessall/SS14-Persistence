- type: entity
  name: crash cart
  id: CrashCart
  parent: [BaseStructureDynamic, StructureWheeled]
  description: A crash cart used to carry medical supplies and equipment.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Furniture/crashcart.rsi
    layers:
    - state: base
  - type: Appearance
  - type: ItemSlots
    slots:
      healthanalyzer:
        priority: 1
        ejectOnInteract: true
        whitelist:
          tags:
          - DiscreteHealthAnalyzer
      defib:
        priority: 2
        ejectOnInteract: true
        whitelist:
          components:
          - Defibrillator
      medkit3:
        priority: 3
        ejectOnInteract: true
        whitelist:
          tags:
          - Medkit
      medkit2:
        priority: 4
        ejectOnInteract: true
        whitelist:
          tags:
          - Medkit
      medkit1:
        priority: 5
        ejectOnInteract: true
        whitelist:
          tags:
          - Medkit
      bloodbag_slot2:
        priority: 6
        ejectOnInteract: false
        whitelist:
          tags:
          - Bloodpack
      bloodbag_slot1:
        priority: 7
        ejectOnInteract: false
        whitelist:
          tags:
          - Bloodpack
  - type: ItemMapper
    mapLayers:
      defib:
        whitelist:
          components:
          - Defibrillator
      healthanalyzer:
        whitelist:
          tags:
          - DiscreteHealthAnalyzer
      medkit1:
        minCount: 1
        whitelist:
          tags:
          - Medkit
      medkit2:
        minCount: 2
        whitelist:
          tags:
          - Medkit
      medkit3:
        minCount: 3
        whitelist:
          tags:
          - Medkit 
      bloodpack1:
        minCount: 1
        whitelist:
          tags:
          - Bloodpack
      bloodpack2:
        minCount: 2 
        whitelist:
          tags:
          - Bloodpack
  - type: Construction
    graph: CrashCartGraph
    node: crashcart
