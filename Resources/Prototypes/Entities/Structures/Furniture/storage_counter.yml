- type: entity
  id: BaseStorageCounter
  abstract: true
  parent: BaseStructure 
  description: A counter with storage capacity
  components:
  - type: Sprite
    drawDepth: TableLayer
    sprite: Structures/Furniture/storage-counter.rsi
  - type: Appearance
  - type: InteractionOutline
  - type: Climbable
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.1,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Storage
    grid:
    - 0,0,5,5
    - 7,0,12,5
    maxItemSize: Huge
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []

- type: entity
  name: frame
  id: StorageCounterFrame
  parent: BaseStructure
  components:
  - type: Sprite
    sprite: Structures/Furniture/storage-counter.rsi
    layers:
    - state: frame-step0
      map: ["enum.ConstructionVisuals.Layer"]
  - type: Appearance
  - type: InteractionOutline
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          frame-step0: { state: frame-step0 }
          frame-step1: { state: frame-step1 }
          frame-step2: { state: frame-step2 }
          frame-step3: { state: frame-step3 }
  - type: Construction
    graph: StorageCounter
    node: frame-step0

- type: entity
  name: storage counter
  id: StorageCounter
  parent: BaseStorageCounter
  components:
  - type: Sprite
    state: frame-step3
    layers:
    - state: frame-step3
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed-white
      map: ["enum.StorageVisualLayers.Door"]
    - state: counter
  - type: EntityStorageVisuals
    stateDoorOpen: open-white
    stateDoorClosed: closed-white
  - type: Construction
    graph: StorageCounter
    node: storagecounter

- type: entity
  name: cargo storage counter
  id: StorageCounterCargo
  parent: BaseStorageCounter
  components:
  - type: Sprite
    state: frame-step3
    layers:
    - state: frame-step3
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed-cargo
      map: ["enum.StorageVisualLayers.Door"]
    - state: counter-grey
  - type: EntityStorageVisuals
    stateDoorOpen: open-cargo
    stateDoorClosed: closed-cargo
  - type: Construction
    graph: StorageCounter
    node: storagecountercargo

