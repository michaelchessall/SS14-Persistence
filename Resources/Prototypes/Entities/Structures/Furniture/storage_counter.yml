- type: entity
  id: BaseStorageCounter
  parent: BaseStructureDynamic
  description: A counter with storage capacity
  components:
  - type: Sprite
    drawDepth: TableLayer
    sprite: Structures/Furniture/storage-counter.rsi
    noRot: true
    layers:
    - state: full
  - type: Icon
    state: full
  - type: Appearance
  - type: InteractionOutline
  - type: Climbable
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.1,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Storage
    grid:
    - 0,0,5,5
    - 7,0,12,5
    maxItemSize: Huge
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: IconSmooth
    key: state
    base: state_
