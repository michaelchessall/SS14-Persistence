- type: entity
  parent: [BaseStructureDynamic, StructureWheeled]
  id: ToolCartEmpty
  name: Tool cart
  description: A cart for carrying tools.
  suffix: Empty
  components:
  - type: Sprite
    sprite: Objects/Specific/Engineering/tool-cart.rsi
    state: tool_cart_empty
    noRot: true
  - type: Storage
    grid:
    - 0,0,5,3
    - 0,5,5,8
    maxItemSize: Huge 
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface 
  - type: ItemMapper
    mapLayers:
      drill:
        whitelist:
          tags:
          - Powerdrill
      wirecutter:
        whitelist:
          tags:
          - Wirecutter
      wrench:
        whitelist:
          tags:
          - Wrench
      screwdriver:
        whitelist:
          tags:
          - Screwdriver
      multitool:
        whitelist:
          tags:
          - Multitool
      crowbar:
        whitelist:
          tags:
          - Crowbar      
