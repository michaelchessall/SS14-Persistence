
- type: entity
  name: mechanic cart
  id: MechanicCart
  parent: [BaseStructureDynamic, StructureWheeled]
  components:
  - type: Clickable
  - type: Sprite
    sprite: Objects/Specific/Engineering/mechanic_cart.rsi
    noRot: true
    layers:
    - state: base
    - state: stuff-0
    - map: ["enum.StorageFillLayers.Fill"]
    drawdepth: Objects
  - type: StorageFillVisualizer
    maxFillLevels: 6
    fillBaseName: stuff
  - type: Appearance
  - type: InteractionOutline
  - type: Storage
    grid:
    - 0,0,9,3
    - 0,5,9,8
    maxItemSize: Huge
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface 
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2