- type: entity
  parent: [ BaseWallmountMachine, BaseThruster, ConstructibleWallmountMachine ]
  id: WallmountThruster
  name: wallmount thruster
  description: A wall mount thruster
  abstract: false
  components:
  - type: Machine
    board: ThrusterWallmountMachineCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
  - type: Sprite
    sprite: Structures/Shuttles/thruster.rsi
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
    scale: 0.7, 0.5
    offset: 0, 0.30
  - type: Thruster
    thrust: 50
  - type: WallMount
    direction: 180
