    unwieldOnUse: false
  - type: GunUnwieldedPenalty
    angleMultiplier: 2
  - type: SpeedModifiedOnWield
    walkModifier: 0.5
    sprintModifier: 0.5

- type: entity
  id: BaseGunWieldClassRifle
