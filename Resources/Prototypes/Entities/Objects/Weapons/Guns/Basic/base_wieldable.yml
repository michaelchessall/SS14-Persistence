# A basic inheritable template for a gun that is wieldable and has the standard inaccuracy.
- type: entity
  id: BaseGunWieldable
  abstract: true
  components:
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -30
  - type: Gun
    minAngle: 21
    maxAngle: 32

# Per-class wield rules: worse accuracy while unwielded, slower movement while wielded.
- type: entity
  id: BaseGunWieldClassPistol
  abstract: true
  components:
  - type: AkimboCapable
  - type: Wieldable
    unwieldOnUse: false
  - type: GunUnwieldedPenalty
    angleMultiplier: 1.3
  - type: SpeedModifiedOnWield
    walkModifier: 0.7
    sprintModifier: 0.7

- type: entity
  id: BaseGunWieldClassSMG
  abstract: true
  components:
