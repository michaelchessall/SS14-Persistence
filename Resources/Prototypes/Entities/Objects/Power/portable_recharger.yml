- type: entity
  parent: Clothing
  id: PortableRecharger
  name: portable recharger
  description: High-tech recharger adapted for portability.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: Objects/Power/portable_recharger.rsi
    layers:
    - map: ["enum.PowerChargerVisualLayers.Base"]
      state: charging
    - map: ["enum.PowerChargerVisualLayers.Light"]
      state: charging-unlit
      shader: unshaded
  - type: Clothing
    equippedPrefix: charging
    quickEquip: false
    slots:
    - back
    - suitStorage # Persistence 14 - Allows the Portable Recharger to be worn on the suitStorage slot
  - type: Charger
    slotId: charger_slot
    portable: true
  - type: PowerChargerVisuals
  - type: StaticPrice
    price: 500
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: ContainerContainer
    containers:
      charger_slot: !type:ContainerSlot
  - type: ItemSlots
    allowSmartEquip: true
    slots:
      charger_slot:
        # ejectOnInteract: true # Persistence 14 - Disabling this allows you to alt+click to take an item out of it
        whitelist:
          components:
          - BatteryAmmoProvider
          - PowerCell # Persistence 14 - Allows the Portable Recharger to also charge battery cells
  - type: PhysicalComposition
    materialComposition:
      Steel: 800
      Plastic: 400
      Uranium: 200
      Plasma: 200
