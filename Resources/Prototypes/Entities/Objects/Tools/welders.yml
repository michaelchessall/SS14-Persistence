- type: entity
  abstract: true
  parent: [SolutionWelder, BaseItem]
  id: BaseWelder
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/welder_drop.ogg
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Small
    sprite: Objects/Tools/welder.rsi
  - type: ItemToggleExaminableStatus
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: WelderOn
      params:
        variation: 0.125
        volume: -5
    soundDeactivate:
      collection: WelderOff
      params:
        variation: 0.125
        volume: -5
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
    activatedDamage:
      types:
        Heat: 8
  - type: ItemToggleSize
    activatedSize: Large
  - type: ItemToggleHot
  - type: ComponentToggler
    components:
    - type: IgniteOnMeleeHit
    - type: DisarmMalus
      malus: 0.6
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: UseDelay
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Blunt: 5 #i mean... i GUESS you could use it like that
    soundHit:
      collection: MetalThud
  - type: Tool
    useSound:
      collection: Welder
    qualities: [ Welding ]
  - type: Welder
  - type: PointLight
    enabled: false
    radius: 1.5
    color: orange
    netsync: false
  - type: ItemTogglePointLight
  - type: Appearance
  - type: RequiresEyeProtection
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
  - type: StaticPrice
    price: 40
  - type: IgnitionSource
    temperature: 700

- type: entity
  parent: BaseWelder
  id: Welder
  name: welding tool
  description: "Melts anything as long as it's fueled, don't forget your eye protection!"
  components:
  - type: Sprite
    sprite: Objects/Tools/welder.rsi
  - type: PhysicalComposition # gives back 90% mat used to print when recycled
    materialComposition:
      Steel: 360
      Plastic: 90
  - type: Solution
    solution:
      maxVol: 250 #Persi adjustment, small tanks makes engineering work infernal
  - type: RefillableSolution
    solution: welder

- type: entity
  name: industrial welding tool
  parent: Welder
  id: WelderIndustrial
  description: "New improved welder made with heavy use in mind. The tip uses a more durable material to reach higher temperatures, with a higher fuel tank capacity."
  components:
  - type: Sprite
    sprite: Objects/Tools/welder_industrial.rsi
  - type: Item
    sprite: Objects/Tools/welder_industrial.rsi
  - type: PhysicalComposition # gives back 90% mat used to print when recycled
    materialComposition:
      Titanium: 270
      Steel: 180
      Aluminium: 180
      Copper: 180
  - type: Tool
    speedModifier: 1.1
  - type: Solution
    solution:
      maxVol: 500 #persi adjustment

- type: entity
  name: advanced industrial welding tool
  parent: WelderIndustrial
  id: WelderIndustrialAdvanced
  description: "Miniaturization and better materials make this welder the best welder on the market, for now anyways"
  components:
  - type: Sprite
    sprite: Objects/Tools/welder_industrialadv.rsi
  - type: Item
    sprite: Objects/Tools/welder_industrialadv.rsi
  - type: Tool
    speedModifier: 1.3
  - type: Solution
    solution:
      maxVol: 750 #persi adjustment
  - type: PhysicalComposition # gives back 90% mat used to print when recycled
    materialComposition:
      Titanium: 180
      Plasteel: 270
      Aluminium: 270
      Copper: 45

- type: entity
  name: experimental welding tool
  parent: BaseWelder
  id: WelderExperimental
  description: "An experimental welder capable of fuel generation and less harmful to the eyes."
  components:
  - type: Sprite
    sprite: Objects/Tools/welder_experimental.rsi
  - type: Item
    sprite: Objects/Tools/welder_experimental.rsi
  - type: PointLight
    enabled: false
    radius: 1.5
    color: lightblue
  - type: Welder
    fuelReagent: WeldingFuel # just gonna use welding fuel as fuel for now, in the future I would like to make it use powercells
  - type: RequiresEyeProtection
    statusEffectTime: 5 # less harmful; sunglasses can block it
  - type: Tool
    speedModifier: 0.8
  - type: PhysicalComposition # gives back 90% mat used to print when recycled
    materialComposition:
      Steel: 720
      Plasma: 180
      Silver: 90
      Titanium: 90
  - type: Solution
    solution:
      maxVol: 450 #Persi adjustment
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 0.1 #Persi adjustent

- type: entity
  parent: BaseWelder
  name: emergency welding tool
  id: WelderMini
  description: "A disposable welder used during emergencies. Can't be refuelled"
  components:
  - type: Sprite
    sprite: Objects/Tools/welder_mini.rsi
  - type: Item
    size: Tiny
    sprite: Objects/Tools/welder_mini.rsi
  - type: Tool
    speedModifier: 0.7
  - type: Welder
    canRefill: false
  - type: PointLight
    enabled: false
    radius: 1.0
    color: orange
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
  - type: Solution
    solution:
      maxVol: 600
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 600 # persi adjustment

- type: entity
  parent: [ Welder, BaseXenoborgContraband ]
  id: RefuelingWelder
  name: refueling welding tool
  description: "A slow welder that can refuel itself over time."
  components:
  - type: Tool
    speedModifier: 0.5
  - type: Welder
    fuelConsumption: 2
    fuelLitCost: 1
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 0.1
