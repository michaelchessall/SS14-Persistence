# Sneeze and Smell Target are granted/revoked dynamically, not at MapInit - see SharedScentSystem.
- type: entity
  parent: BaseAction
  id: ActionToggleSniff
  name: Toggle Smelling
  description: Start or stop actively smelling, letting you see lingering scent trails in the world.
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite
    sprite: _Starlight/Interface/Actions/actions_scent.rsi
    layers:
    - state: smell-off
      map: ["enum.ActionVisuals.Icon"]
    - state: smell-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ToggleSniffActionEvent

- type: entity
  parent: BaseAction
  id: ActionSneeze
  name: Sneeze
  description: Clear your nose of whatever scent you were tracking.
  components:
  - type: Action
    useDelay: 2
  - type: Sprite
    sprite: _Starlight/Interface/Actions/actions_scent.rsi
    layers:
    - state: sneeze
  - type: InstantAction
    event: !type:SneezeActionEvent

- type: entity
  parent: BaseAction
  id: ActionSniffObject
  name: Smell Target
  description: Smell a target to identify the scents left on it.
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _Starlight/Interface/Actions/actions_scent.rsi
    layers:
    - state: smell-target
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:SniffObjectActionEvent