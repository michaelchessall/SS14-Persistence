- type: constructionGraph
  id: SignGraph
  start: start

  graph:
  - node: start
    edges:
    - to: sign
      steps:
      - material: Steel
        amount: 2
        doAfter: 2

  - node: sign
    entity: SignBlank
    edges:
    - to: start
      steps:
      - tool: Screwing
        doAfter: 5
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity

