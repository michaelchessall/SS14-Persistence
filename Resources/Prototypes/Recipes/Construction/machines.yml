# region Base
- type: construction
  abstract: true
  id: BaseMachine
  category: construction-category-machines
  placementMode: SnapgridCenter
  conditions:
  - !type:TileNotBlocked

- type: construction
  abstract: true
  parent: BaseMachine
  id: BaseSwitch
  canBuildInImpassable: true
  conditions:
  - !type:WallmountCondition
# endregion Base

# region Machines
- type: construction
  parent: BaseMachine
  id: Computer
  graph: Computer
  targetNode: computer

- type: construction
  parent: BaseMachine
  id: MachineFrame
  graph: Machine
  targetNode: machine
# endregion Machines

