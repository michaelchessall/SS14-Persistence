- type: entity
  id: DebugStick
  parent: BaseItem
  name: debug stick
  description: How the hell did you get this?
  components:
  - type: Sprite
    sprite: Objects/Tools/crowbar.rsi
    state: icon
  - type: Item
    size: Small
  - type: Clickable
  - type: InteractionOutline
  - type: DebugStick
    cord: ContainmentFieldCord

- type: entity
  id: ContainmentFieldCord
  name: containment field cord
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: BelowMobs
    enableOverrideDir: true
    overrideDir: east
    sprite: Structures/Power/Generation/Singularity/containment_field.rsi
    state: field
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: Cord
    mode: Tile

