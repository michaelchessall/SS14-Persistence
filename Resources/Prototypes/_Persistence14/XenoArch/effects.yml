## Create Fake Money
- type: entity
  id: XenoArtifactOldCashSpawn
  parent: BaseXenoArtifactEffect
  description: Create money
  components:
  - type: XenoArtifactNode
    maxDurability: 2
    maxDurabilityCanDecreaseBy:
      min: 0
      max: 1
  - type: XAEApplyComponents
    applyIfAlreadyHave: true
    refreshOnReactivate: true
    components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      spawnDetached: true
      table: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 2, 4
        children:
        - id: TreasureCoinIron
          weight: 0.75
        - id: TreasureCoinSilver
          weight: 0.5
        - id: TreasureCoinGold
          weight: 0.25
        - id: TreasureCoinDiamond
          weight: 0.1

## Specific Healing Effects
- type: entity
  id: XenoArtifactHealBrute
  parent: BaseXenoArtifactEffect
  description: Mends brute injuries
  components:
  - type: XAEDamageInArea
    damageChance: 1
    radius: 8
    whitelist:
      components:
      - MobState
    damage:
      types:
        Blunt: -50
        Piercing: -50
        Slash: -50

- type: entity
  id: XenoArtifactHealBurn
  parent: BaseXenoArtifactEffect
  description: Soothes burn injuries
  components:
  - type: XAEDamageInArea
    damageChance: 1
    radius: 8
    whitelist:
      components:
      - MobState
    damage:
      types:
        Heat: -50
        Cold: -50
        Shock: -50

- type: entity
  id: XenoArtifactHealRare
  parent: BaseXenoArtifactEffect
  description: Cures uncommon injuries
  components:
  - type: XAEDamageInArea
    damageChance: 1
    radius: 8
    whitelist:
      components:
      - MobState
    damage:
      types:
        Caustic: -50
        Poison: -50
        Radiation: -50
        Cellular: -50