## Partial Battery Charge
- type: entity
  id: XenoArtifactChargeBatteryLow
  parent: BaseXenoArtifactEffect
  description: Partially charges nearby batteries
  components:
  - type: XAEChargeBattery
    chargePercent: 30.0
  - type: XAETelepathic
    messages:
    - charge-artifact-popup

## Material Spawn, replaces upstream versions.
- type: entity
  id: XenoArtifactRawMaterialSpawn
  abstract: true
  parent: BaseXenoArtifactEffect
  components:
  - type: XenoArtifactNode
    maxDurability: 4
    maxDurabilityCanDecreaseBy:
      min: 0
      max: 2

- type: entity
  id: XenoArtifactRawMaterialSpawnSilverFew
  parent: XenoArtifactRawMaterialSpawn
  description: Create a bit of raw silver
  components:
  - type: XAEApplyComponents
    applyIfAlreadyHave: true
    refreshOnReactivate: true
    components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      spawnDetached: true
      table: !type:AllSelector
        children:
        - id: SilverOre1
          rolls: !type:RangeNumberSelector
            range: 1, 4

