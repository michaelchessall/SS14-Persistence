## Tool Effects
- type: entity
  id: XenoArtifactToolJaws
  parent: BaseOneTimeXenoArtifactEffect
  description: Obtains ability to cut and pry
  components:
  - type: XAEApplyComponents
    components:
    - type: ToolTileCompatible
    - type: Tool
      qualities:
      - Prying
      speedModifier: 2 # Very powerful to balance out the desire to sell or scrap for points
      useSound: /Audio/Items/jaws_pry.ogg
    - type: MultipleTool
      statusShowBehavior: true
      entries:
      - behavior: Prying
        useSound:
          path: /Audio/Items/jaws_pry.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg
      - behavior: Cutting
        useSound:
          path: /Audio/Items/jaws_cut.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg

- type: entity
  id: XenoArtifactToolPowerDrill
  parent: BaseOneTimeXenoArtifactEffect
  description: Obtains ability to screw and tighten
  components:
  - type: XAEApplyComponents
    components:
    - type: ToolTileCompatible
    - type: Tool
      qualities:
      - Screwing
      speedModifier: 2 # Very powerful to balance out the desire to sell or scrap for points
      useSound: /Audio/Items/drill_use.ogg
    - type: MultipleTool
      statusShowBehavior: true
      entries:
      - behavior: Screwing
        useSound:
          path: /Audio/Items/jaws_pry.ogg
        changeSound:
          path: /Audio/Items/drill_use.ogg
      - behavior: Anchoring
        useSound:
          path: /Audio/Items/jaws_cut.ogg
        changeSound:
          path: /Audio/Items/ratchet.ogg

- type: entity
  id: XenoArtifactToolKnife
  parent: BaseOneTimeXenoArtifactEffect
  description: Gains a sharp edge
  components:
  - type: XAEApplyComponents
    components:
    - type: ToolTileCompatible
    - type: Tool
      qualities:
      - Slicing
      speedModifier: 2 # Very powerful to balance out the desire to sell or scrap for points
      useSound: /Audio/Items/drill_use.ogg
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 12 # A decently powerful knife
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

