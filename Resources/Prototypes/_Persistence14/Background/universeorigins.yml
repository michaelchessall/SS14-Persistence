- type: universeOrigin
  id: Zenith
  name: Zenith Universe
  description: "The Threshold in the Zenith Universe is controlled by the Solar Legion.\nNew colonists are required to swear an oath to the Queen Valeria before being free to explore the Threshold.\n[italic]This is a suitable choice for characters from past Persistence 14 iterations."
