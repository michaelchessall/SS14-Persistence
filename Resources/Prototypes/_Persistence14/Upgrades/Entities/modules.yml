- type: entity
  id: BaseUpgradeModule
  parent: BaseItem
  name: upgrade module
  description: A piece of tech that can upgrade items and machines.
  abstract: true
  components:
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Sprite
    sprite: _Persistence14/Objects/Specific/Upgrades/modules.rsi
  - type: StaticPrice
    price: 100
  - type: UpgradeModule
    targetModule: Zenith

- type: entity
  id: ZenithUpgradeModule
  parent: BaseUpgradeModule
  name: upgrade module (Zenith-Pattern)
  components:
  - type: Sprite
    layers:
    - state: solar-legion
    - state: icon-SL
  - type: UpgradeModule
    targetModule: Zenith

