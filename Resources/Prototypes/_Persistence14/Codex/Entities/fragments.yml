- type: entity
  id: BaseCodexFragment
  parent: BaseItem
  name: codex fragment
  description: Using this will unlock a codex entry.
  abstract: true
  components:
  - type: Item
  - type: Sprite
    sprite: _Persistence14/Objects/Specific/codex.rsi
  - type: StaticPrice
    price: 100
  - type: CodexFragment

- type: entity
  id: MarineCodexFragment
  parent: BaseCodexFragment
  name: codex fragment (UNMC Remnant)
  description: A collection of reports and debriefs in a camo folder with the UNMC logo on it. (Unlocks codex entries related to the UNMC.)
  components:
  - type: Sprite
    layers:
    - state: unmc-codex
  - type: CodexFragment
    possibleEntries:
      - Marine101
      - Marine102
      - Marine103
      - Marine104
      - Marine105

- type: entity
  id: ShadowCodexFragment
