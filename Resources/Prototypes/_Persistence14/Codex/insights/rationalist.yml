- type: insightTrait
  id: AnomalySense
  name: insight-ration-1-name
  content: insight-ration-1-desc
  next: Rationalist2
  trait: AnomalySense

- type: trait
  id: AnomalySense
  name: insight-ration-1-name
  description: insight-ration-1-desc
  selectable: false
  components:
    - type: ActionGrant
      actions:
        - ActionAnomalySense
      autoDelete: true

- type: entity
  parent: BaseAction
  id: ActionAnomalySense
  name: Sense Anomaly
  description: Sense the location of the nearest anomaly.
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    layers:
    - state: flower
  - type: InstantAction
    event: !type:SenseAnomalyEvent

- type: insightTrait
  id: Rationalist2
  name: insight-ration-2-name
  content: insight-ration-2-desc
  trait: Rationalist2
  next: Rationalist3

- type: trait
  id: Rationalist2
  name: insight-ration-2-name
  description: insight-ration-2-desc
  selectable: false
  components:
    - type: ActionGrant
      actions:
        - ArtifexiumBurst
      autoDelete: true

- type: entity
  parent: BaseAction
  id: ArtifexiumBurst
  name: Artifexium Burst
  description: Emits a burst of artifexium, randomly triggering a primed node on all nearby artifacts.
  components:
  - type: Action
    useDelay: 1h
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: shield
  - type: InstantAction
    event: !type:ArtifexiumBurstEvent
      range: 3

- type: insightTrait
  id: Rationalist3
  name: insight-ration-3-name
  content: insight-ration-3-desc
  next: Rationalist4
  trait: AnomalySense

- type: insightTrait
  id: Rationalist4
  name: insight-ration-4-name
  content: insight-ration-4-desc
  trait: AnomalySense
