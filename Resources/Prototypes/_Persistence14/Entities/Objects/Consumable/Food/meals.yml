      - ClothMade


#Jerkies

- type: entity
  parent: FoodMealBase
  id: FoodMealJerky
  name: jerky
  description: Dried meat with salt, simple and satiating.
  components:
  - type: Item
    storedOffset: 0,-1
    inhandVisuals:
      left:
      - state: jerky-inhand-left
      right:
      - state: jerky-inhand-right
  - type: FlavorProfile
    flavors:
      - meaty
      - salty
  - type: Sprite
    sprite: _Persistence14/Objects/Consumable/Food/meals.rsi
    state: jerky
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Protein
        Quantity: 10
      - ReagentId: TableSalt
        Quantity: 3
  - type: Tag
    tags:
    - Meat


