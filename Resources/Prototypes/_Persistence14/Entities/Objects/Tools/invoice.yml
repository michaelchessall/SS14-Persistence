- type: entity
  parent: BaseItem
  id: Invoice
  name: digital invoice
  description: A digital invoice which processes payments.
  components:
    - type: Sprite
      sprite: _Persistence14/Objects/Misc/bureaucracy.rsi
      state: invoiceunpaid
    - type: Item
      size: Tiny
    - type: Invoice
    - type: UserInterface
      interfaces:
        enum.InvoiceUiKey.Key:
          type: InvoiceBoundUserInterface
    - type: ActivatableUI
      key: enum.InvoiceUiKey.Key
      requiresComplex: true
      requireActiveHand: false
      singleUser: true
    - type: PaperVisuals
    - type: Appearance
    - type: Tag
      tags:
      - Document
    - type: PhysicalComposition
      materialComposition:
        Paper: 100
