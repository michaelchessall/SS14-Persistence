# Machine board for the requisitions console. Print it on a circuit imprinter (unlocked by the
# "Requisitions Logistics" T2 research), then insert it into a machine frame to build the console.
- type: entity
  id: MachineRequisitionsConsoleCircuitboard
  parent: BaseMachineCircuitboard
  name: requisitions console machine board
  description: A machine printed circuit board for a requisitions console.
  components:
  - type: MachineBoard
    prototype: MachineRequisitionsConsole
    stackRequirements:
      Manipulator: 10
      Glass: 2
