- type: entity
  id: GenericTankHighCapacity
  parent: [StorageTankBig, GenericTank]
  name: high-capacity storage tank
  description: A highly pressurized storage tank made to hold gargantuan amounts of water.
  components:
  - type: StaticPrice
    price: 2000
  - type: Sprite
    sprite: Structures/Storage/tanks.rsi
    layers:
    - state: highgenerictank-1
    - state: highwatertank-2-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 7
    fillBaseName: highwatertank-2-
  - type: Solution
    id: tank
    solution:
      maxVol: 10000
  #   It's pressurized...
  - type: ExaminableSolution
    solution: tank
  - type: ReagentTank
    transferAmount: 100
  - type: Icon
    sprite: Structures/Storage/tanks.rsi
    state: "highgenerictank-1"
  - type: Construction
    graph: GenericHighCapacityTankGraph
    node: generictankhigh
 
# Trough PR (Its a tank but you eat from it) 
- type: entity 
  id: Trough
  parent: [ GenericTank ]
  name: trough
  placement:
    mode: SnapgridCenter
  description: A defunct refurbished hydrophonic tray now used to hold water or slop for animals.
  components:
  - type: Transform
    noRot: false
    anchored: true
  - type: StaticPrice
    price: 150
  - type: Fixtures
  - type: Sprite
    sprite: _Persistence14/Structures/storage/Tanks/trough.rsi
    noRot: false
    layers:
    - state: trough
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
  - type: Solution
    id: tank
    solution:
      maxVol: 960
  - type: ExaminableSolution
    solution: tank
  - type: ReagentTank
    transferAmount: 100
  - type: Icon
    sprite: _Persistence14/Structures/storage/Tanks/trough.rsi
    state: "trough"
  - type: Construction
    graph: TroughGraph
    node: trough
  - type: Edible
    edible: Drink
    solution: tank
    destroyOnEmpty: false
  - type: Rotatable
  - type: Tag
    tags:
    - MessyDrinkerImmune