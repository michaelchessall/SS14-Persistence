- type: entity
  parent: [ WindowRCDResistant, BaseDeltaPressureReinforcedGlass ]
  id: ShuttleWindowTitanium
  name: titanium shuttle window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Persistence14/Structures/Windows/titanium-shuttle-window.rsi
  - type: Icon
    sprite: _Persistence14/Structures/Windows/titanium-shuttle-window.rsi
    state: icon
  - type: IconSmooth
    base: swindow
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodTitanium:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ExaminableDamage # persi - damage visuals
    messages: WindowMessages
  - type: Construction
    graph: Window
    node: shuttleWindowTitanium