- type: entity
  parent: [ WindowRCDResistant, BaseDeltaPressureReinforcedGlass ]
  id: ShuttleWindowTitanium
  name: titanium shuttle window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Persistence14/Structures/Windows/titanium-shuttle-window.rsi
  - type: Icon
    sprite: _Persistence14/Structures/Windows/titanium-shuttle-window.rsi
    state: icon
  - type: IconSmooth
    base: swindow
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodTitanium:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ExaminableDamage # persi - damage visuals
    messages: WindowMessages
  - type: Construction
    graph: Window
    node: shuttleWindowTitanium

- type: entity
  parent: ShuttleWindowTitanium
  id: ShuttleWindowTitaniumDiagonal
  suffix: Diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Persistence14/Structures/Windows/titanium-shuttle-window-diagonal.rsi
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    mode: Diagonal
    key: windows
    base: state
  - type: Icon
    sprite: _Persistence14/Structures/Windows/titanium-shuttle-window-diagonal.rsi
    state: state0
  - type: Construction
    graph: WindowDiagonal
    node: shuttleWindowTitaniumDiagonal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks_diagonal.rsi