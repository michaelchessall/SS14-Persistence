- type: constructionGraph
  id: lvcable
  start: cable
  graph:
  - node: cable
    entity: CableApcExtension
    edges:
    - to: junction
      steps:
      - material: Plastic
        amount: 1
  
  - node: junction
    entity: CableJunctionLV
    edges:
    - to: cable
      steps:
      - tool: Cutting
        doAfter: 1
      completed:
      - !type:GivePrototype
        prototype: SheetPlastic1
        amount: 1

