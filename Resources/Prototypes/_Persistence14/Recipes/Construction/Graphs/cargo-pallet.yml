- type: constructionGraph
  id: CargoPalletGraph
  start: start
  graph:
  - node: start
    edges:
    - to: pallet
      steps:
      - material: Plasteel
        amount: 2
      - material: MetalRod
        amount: 4
        doAfter: 4
  
  - node: pallet
    entity: CargoPallet
    transform:
    - !type:CopyAccessReader {}
    edges:
    - to: start
      steps:
      - tool: Cutting
        doAfter: 2
      completed:
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 4
      - !type:SpawnPrototype
        prototype: SheetPlasteel1
        amount: 2
      - !type:DeleteEntity {}
    
    - to: sell
      steps:
      - tag: CargoPalletUpgradeTemplateSell
        name: construction-graph-tag-cargo-pallet-sell
        store: upgrade-template
        doAfter: 2
      completed:
      - !type:PlaySound
        sound: /Audio/Machines/id_insert.ogg
    
    - to: buy
      steps:
      - tag: CargoPalletUpgradeTemplateBuy
        name: construction-graph-tag-cargo-pallet-buy
        store: upgrade-template
        doAfter: 2
      completed:
      - !type:PlaySound
        sound: /Audio/Machines/id_insert.ogg

  - node: sell
    entity: CargoPalletSell
    transform:
    - !type:CopyAccessReader {}
    edges:
    - to: pallet
      steps:
      - tool: Prying
        doAfter: 2
      completed:
      - !type:EmptyContainer
        container: upgrade-template
        pickup: true
      conditions:
      - !type:UserAccess

  - node: buy
    entity: CargoPalletBuy
    transform:
    - !type:CopyAccessReader {}
    edges:
    - to: pallet
      steps:
      - tool: Prying
        doAfter: 2
      completed:
      - !type:EmptyContainer
        container: upgrade-template
        pickup: true
      conditions:
      - !type:UserAccess
   
- type: constructionGraph
  id: CargoPalletUpgradeGraph
  start: sell
  graph:
  - node: sell
    entity: CargoPalletUpgradeTemplateSell
    edges:
    - to: buy
      steps:
      - tool: Screwing
        doAfter: 2
  
  - node: buy
    entity: CargoPalletUpgradeTemplateBuy
    edges:
    - to: sell
      steps:
      - tool: Screwing
        doAfter: 2
      