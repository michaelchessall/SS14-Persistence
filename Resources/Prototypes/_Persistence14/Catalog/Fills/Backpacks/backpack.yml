#ERT Suit Bundles
- type: entity
  parent: ClothingBackpackERTChaplain
  id: ClothingBackpackERTChaplainHardsuitBundle
  name: ERT chaplain hardsuit bundle
  description: "Contains Nanotrasen's ERT hardsuit built for handling potential supernatural threats."
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingOuterHardsuitERTChaplain
        - !type:NestedSelector
          tableId: ERTHardsuitExtrasEntityTable

- type: entityTable
  id: ERTHardsuitExtrasEntityTable
  table: !type:AllSelector
    children:
    - id: ClothingMaskGasERT
    - id: ClothingHandsGlovesCombat
    - id: DoubleEmergencyOxygenTankFilled
    - id: DoubleEmergencyNitrogenTankFilled

