- type: entity
  id: TradeGood
  parent: BaseItem
  name: trade node
  description: A highly valuable device which generates resonance when stored on a trade station. Always exports for $10000.
  components:
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Sprite
    sprite: _Persistence14/Objects/Specific/Upgrades/modules.rsi
    layers:
    - state: solar-legion
    - state: icon-SL
  - type: StaticPrice
    price: 10000
  - type: TradeGood
