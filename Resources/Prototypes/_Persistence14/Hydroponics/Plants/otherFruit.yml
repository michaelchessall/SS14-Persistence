- type: entity
  parent: BasePlant
  id: TomatoPlants
  name: tomato plant
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tomato.rsi
  - type: PlantData
    name: seeds-tomato-name
    packetPrototype: TomatoSeeds
    productPrototypes: [ FoodTomato ]
    mutationPrototypes: [ BlueTomatoPlants, BloodTomatoPlants ]
  - type: Plant
    lifespan: 25
    maturation: 8
    production: 6
    yield: 2
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantGrowth
    waterConsumption: 0.6
    nutrientConsumption: 0.4
  - type: PlantAtmospheric
    lowHeatTolerance: 288 # 15°C
    highHeatTolerance: 308 # 35°C
  - type: PlantChemicals
    chemicals:
      Nutriment:
        id: BasicNutriment7
      Vitamin:
        id: BaseVitamin3
      Water:
        id: BaseWater4

