- type: entity
  parent: BasePlant
  id: BananaPlants
  name: banana plant
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/banana.rsi
  - type: PlantData
    name: seeds-banana-name
    packetPrototype: BananaSeeds
    productPrototypes: [ FoodBanana ]
    mutationPrototypes: [ MimanaPlants ]
