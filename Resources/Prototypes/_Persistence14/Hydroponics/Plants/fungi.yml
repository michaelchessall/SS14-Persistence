- type: entity
  parent: BasePlant
  id: TowercapPlants
  name: tower cap
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/towercap.rsi
  - type: PlantData
    noun: seeds-noun-spores
    name: seeds-towercap-name
    packetPrototype: TowercapSeeds
    productPrototypes: [ Log ]
    mutationPrototypes: [ SteelcapPlants ]
  - type: Plant
    lifespan: 80
    maturation: 15
    production: 3
    yield: 5
    growthStages: 3
  - type: PlantBaseRequirements
    baseRequirements:
      Nutrient: 10
      Water: 10
  - type: PlantAtmospheric
    lowHeatTolerance: 288 # 15°C
    highHeatTolerance: 308 # 35°C
  - type: PlantTraitLigneous

