- type: entity
  parent: BasePlant
  id: CarrotPlants
  name: carrot
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/carrot.rsi
  - type: PlantData
    name: seeds-carrots-name
    packetPrototype: CarrotSeeds
    productPrototypes: [ FoodCarrot ]
  - type: Plant
    lifespan: 25
    maturation: 10
    production: 3
    yield: 3
    growthStages: 3
  - type: PlantGrowth
    waterConsumption: 0.6
  - type: PlantChemicals
    chemicals:
      JuiceCarrot:
        id: CarrotJuice
      Oculine:
        id: CarrotOculine
      Vitamin:
        id: BasicVitamin4

