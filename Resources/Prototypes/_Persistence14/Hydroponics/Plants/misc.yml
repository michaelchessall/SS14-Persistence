- type: entity
  parent: BasePlant
  id: PeaPlants
  name: pea vine
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/pea.rsi
  - type: PlantData
    name: seeds-pea-name
    packetPrototype: PeaSeeds
    productPrototypes: [ FoodPeaPod ]
    mutationPrototypes: [ LaughinPeaPlants ]
  - type: Plant
    lifespan: 25
    growthStages: 3
    maturation: 8
    production: 6
    yield: 3
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      Nutriment:
        id: BasicNutriment3
      Vitamin:
        id: BasicVitamin2

