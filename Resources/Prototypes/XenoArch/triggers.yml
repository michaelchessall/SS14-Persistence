- type: weightedRandomXenoArchTrigger
  id: DefaultTriggers
  weights:
    TriggerMusic: 1
    TriggerHeat: 1
    TriggerCold: 0.5
    TriggerNoOxygen: 1
    TriggerWater: 1
    TriggerCO2: 0.5
    TriggerPlasma: 0.5
    TriggerN2O: 0.5
    TriggerTritium: 0.1
    TriggerAmmonia: 0.1
    TriggerFrezon: 0.1
    TriggerRadiation: 1
    TriggerPressureHigh: 0.5
    TriggerPressureLow: 1
    TriggerExamine: 1
    # _Persistence14 content: emote triggers (common tier, weight 1 like most triggers)
    TriggerLaugh: 1
    TriggerSigh: 1
    TriggerSneeze: 1
    TriggerCough: 1
    TriggerWhistle: 1
    TriggerCry: 1
    TriggerClap: 1
    TriggerYawn: 1
    TriggerScream: 1
    # end _Persistence14 content
    TriggerBluntDamage: 1
    TriggerPierceDamage: 1
    TriggerWrenching: 0.5
    TriggerPrying: 0.5
    TriggerScrewing: 0.5
    TriggerPulsing: 0.5
    TriggerSlicing: 0.5
    TriggerCutting: 0.5
    TriggerRolling: 0.5
    TriggerBrushing: 0.5
    TriggerTimer: 0.01
    TriggerBlood: 1
    TriggerThrow: 1
    TriggerDeath: 1
    TriggerMagnet: 1
    TriggerConsumeMoney: 1
    TriggerConsumeKnowledge: 0.25
    TriggerConsumeCarbs: 1
    TriggerConsumeMeat: 0.5
    TriggerConsumeProduce: 0.5
    TriggerInteractStamp: 1
    TriggerInteractShock: 1
    TriggerAttackParticleEngine: 0.1
    TriggerAttackParticleAnomaly: 1
    TriggerAttackStaminaDamage: 1
    TriggerAttackLaser: 0.5
    TriggerChemBrute: 1
    TriggerChemBurn: 1
    TriggerChemToxin: 1
    TriggerChemGenetic: .5
    TriggerChemCryo: 1
    TriggerChemNarcotic: .5
    TriggerChemAcidic: .5
    TriggerChemCleaning: 1
    TriggerChemSticky: .5
    TriggerChemSlippery: .5

- type: xenoArchTrigger
  id: TriggerMusic
  tip: xenoarch-trigger-tip-music
  components:
  - type: XATCompNearby
    requireComponentWithName: ActiveInstrument
    radius: 2

- type: xenoArchTrigger
  id: TriggerHeat
  tip: xenoarch-trigger-tip-heat
  components:
  - type: XATTemperature
    targetTemperature: 373
    triggerOnHigherTemp: true
  - type: XATDamageThresholdReached
    typesNeeded:
      Heat: 20
  - type: XATToolUse
    requiredTool: Welding
    delay: 5
    fuel: 10

- type: xenoArchTrigger
  id: TriggerCold
  tip: xenoarch-trigger-tip-cold
  components:
  - type: XATTemperature
    targetTemperature: 255
    triggerOnHigherTemp: false
  - type: XATDamageThresholdReached
    typesNeeded:
      Cold: 20

- type: xenoArchTrigger
  id: TriggerNoOxygen
  tip: xenoarch-trigger-tip-no-oxygen
  components:
  - type: XATGas
    gases:
    - Oxygen
    moles: 10
    shouldBePresent: false

- type: xenoArchTrigger
  id: TriggerWater
  tip: xenoarch-trigger-tip-water
  components:
  - type: XATGas
    gases:
    - WaterVapor
  - type: XATReactive
    whitelist:
      reagents:
      - Water

- type: xenoArchTrigger
  id: TriggerCO2
  tip: xenoarch-trigger-tip-co2
  components:
  - type: XATGas
    gases:
    - CarbonDioxide
  - type: XATReactive
    whitelist:
      reagents:
      - CarbonDioxide

- type: xenoArchTrigger
  id: TriggerPlasma
  tip: xenoarch-trigger-tip-plasma
  components:
  - type: XATGas
    gases:
    - Plasma
  - type: XATReactive
    whitelist:
      reagents:
      - Plasma

- type: xenoArchTrigger
  id: TriggerTritium
  tip: xenoarch-trigger-tip-tritium
  components:
  - type: XATGas
    gases:
    - Plasma
  - type: XATReactive
    whitelist:
      reagents:
      - Tritium

- type: xenoArchTrigger
  id: TriggerAmmonia
  tip: xenoarch-trigger-tip-ammonia
  components:
  - type: XATGas
    gases:
    - Ammonia
  - type: XATReactive
    whitelist:
      reagents:
      - Ammonia

- type: xenoArchTrigger
  id: TriggerN2O
  tip: xenoarch-trigger-tip-n2o
  components:
  - type: XATGas
    gases:
    - NitrousOxide
  - type: XATReactive
    whitelist:
      reagents:
      - NitrousOxide

- type: xenoArchTrigger
  id: TriggerFrezon
  tip: xenoarch-trigger-tip-frezon
  components:
  - type: XATGas
    gases:
    - Frezon
  - type: XATReactive
    whitelist:
      reagents:
      - Frezon

- type: xenoArchTrigger
  id: TriggerRadiation
  tip: xenoarch-trigger-tip-radiation
  components:
  - type: XATDamageThresholdReached
    typesNeeded:
      Radiation: 20

- type: xenoArchTrigger
  id: TriggerMicrowave
  tip: xenoarch-trigger-tip-microwave
  whitelist:
    components:
    - Item
  components:
  - type: XATMicrowave

- type: xenoArchTrigger
  id: TriggerPressureHigh
  tip: xenoarch-trigger-tip-pressure-high
  components:
  - type: XATPressure
    maxPressureThreshold: 385

- type: xenoArchTrigger
  id: TriggerPressureLow
  tip: xenoarch-trigger-tip-pressure-low
  components:
  - type: XATPressure
    minPressureThreshold: 50

- type: xenoArchTrigger
  id: TriggerExamine
  tip: xenoarch-trigger-tip-examine
  components:
  - type: XATExamine

- type: xenoArchTrigger
  id: TriggerInteraction
  tip: xenoarch-trigger-tip-interaction
  components:
  - type: XATInteraction

- type: xenoArchTrigger
  id: TriggerWrenching
  tip: xenoarch-trigger-tip-wrenching
  components:
  - type: XATToolUse
    requiredTool: Anchoring
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-wrenching

- type: xenoArchTrigger
  id: TriggerPrying
  tip: xenoarch-trigger-tip-prying
  components:
  - type: XATToolUse
    requiredTool: Prying
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-prying

- type: xenoArchTrigger
  id: TriggerScrewing
  tip: xenoarch-trigger-tip-screwing
  components:
  - type: XATToolUse
    requiredTool: Screwing
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-screwing

- type: xenoArchTrigger
  id: TriggerPulsing
  tip: xenoarch-trigger-tip-pulsing
  components:
  - type: XATToolUse
    requiredTool: Pulsing
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-pulsing

- type: xenoArchTrigger
  id: TriggerSlicing
  tip: xenoarch-trigger-tip-slicing
  components:
  - type: XATToolUse
    requiredTool: Slicing
  - type: XATDamageThresholdReached
    typesNeeded:
      Slash: 20
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-slicing

- type: xenoArchTrigger
  id: TriggerCutting
  tip: xenoarch-trigger-tip-cutting
  components:
  - type: XATToolUse
    requiredTool: Cutting
  - type: XATDamageThresholdReached
    typesNeeded:
      Slash: 20
  - type: XATExaminableText
    examineText: xenoarch-trigger-examine-cutting

