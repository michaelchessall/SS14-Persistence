- type: marking
  id: YingletTailTailpoof
  bodyPart: TailOverlay
  groupWhitelist: [Yinglet]
  sexRestriction: Female
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
      - !type:SkinColoring
  sprites:
  - sprite: _Scav/Mobs/Customization/Yinglet/yinglet_tail.rsi
    state: tailpoof

# Identical to normal tailpoof but not marked as a default, allows male yinglets to still use tailpoofs without the default forcing it on all of them.
