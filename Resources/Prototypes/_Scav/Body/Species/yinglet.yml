- type: entity
  parent:
  - AppearanceYinglet
  - BaseSpeciesMobOrganic
  id: MobYinglet
  name: Urist McFeethands
  components:
  - type: Damageable
    damageModifierSet: Yinglet
  - type: Speech
    speechSounds: Alto
    allowedEmotes: ['Weh', 'Squeak']
  - type: Vocal
    sounds:
      Male: UnisexYinglet
      Female: UnisexYinglet
      Unsexed: UnisexYinglet
  - type: TypingIndicator
    proto: default
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        # about the same density as a fox
        density: 50
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds #Yinglets have a little over half the normal hp (originally was exactly half, but this was too severe in testing)
    thresholds:
      0: Alive
      75: Critical
      125: Dead
  - type: Destructible #they also gib faster
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 300
      behaviors:
      - !type:GibBehavior { }  
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 40
      behaviors:
      - !type:VomitBehavior
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 100
  - type: MeleeWeapon
    soundHit:
      collection: BarestepWood
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  - type: ThermalRegulator #Yinglets have about 1/7 the mass of humans, these need to be changed otherwise they cant use cryotubes
    metabolismHeat: 400
    radiatedHeat: 50
    implicitHeatRegulation: 150
    sweatHeatRegulation: 250
    shiveringHeatRegulation: 250
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
